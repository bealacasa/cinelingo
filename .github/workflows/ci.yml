name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias de producción (bloqueante)
        run: npm audit --omit=dev --audit-level=high

      - name: Auditoría completa (informativa)
        run: npm audit --audit-level=high || true

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx next typegen && npm run typecheck

      - name: Tests unitarios
        run: npm test

      - name: El seed generado está al día
        run: npm run db:seed:generate && git diff --exit-code supabase/seed.sql

      - name: Build
        run: npm run build

      - name: Presupuesto de bundle
        run: npm run bundle:check

      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Tests e2e (iPhone 15 + Pixel 7)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
